<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iOS 玻璃按钮 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    color: #fff;
    background: #0b1020;
    overflow-x: hidden;
  }

  /* 彩色背景：动态色块 + 可切换图片，用来体现玻璃的模糊/折射 */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .bg.photo { background: url("https://picsum.photos/id/1015/1600/1000") center/cover; }
  .bg.photo .blob { display: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(10px); animation: float 14s ease-in-out infinite alternate; }
  .b1 { width: 420px; height: 420px; background: #ff5f6d; top: -80px; left: -60px; }
  .b2 { width: 360px; height: 360px; background: #36d1dc; bottom: -60px; right: -40px; animation-delay: -4s; }
  .b3 { width: 300px; height: 300px; background: #ffc371; top: 40%; left: 45%; animation-delay: -8s; }
  .stripes {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 2px, transparent 2px 28px);
  }
  @keyframes float { to { transform: translate(120px, 80px) scale(1.15); } }

  main { max-width: 880px; margin: 0 auto; padding: 56px 24px; }
  h1 { font-size: 32px; margin-bottom: 8px; }
  .sub { opacity: .8; margin-bottom: 40px; }
  section { margin-bottom: 44px; }
  h2 { font-size: 15px; font-weight: 600; opacity: .75; margin-bottom: 16px; letter-spacing: .5px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

  /* ===== 经典毛玻璃 ===== */
  .glass-btn {
    position: relative;
    padding: 14px 32px;
    border: none;
    border-radius: 999px;
    font: 600 17px inherit;
    font-family: inherit;
    color: #fff;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.18);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.6),
      0 8px 24px rgba(0, 0, 0, 0.18);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform .2s ease, background .2s ease;
  }
  .glass-btn::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 50%);
  }
  .glass-btn:hover  { background: rgba(255, 255, 255, 0.26); }
  .glass-btn:active { transform: scale(0.96); }
  .glass-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* 变体 */
  .glass-btn.dark { background: rgba(0, 0, 0, 0.25); }
  .glass-btn.dark:hover { background: rgba(0, 0, 0, 0.35); }
  .glass-btn.tint { background: rgba(10, 132, 255, 0.45); }
  .glass-btn.tint:hover { background: rgba(10, 132, 255, 0.6); }
  .glass-btn.sm { padding: 8px 18px; font-size: 14px; }
  .glass-btn.lg { padding: 18px 44px; font-size: 20px; }
  .glass-btn.icon { width: 56px; height: 56px; padding: 0; display: grid; place-items: center; }
  .glass-btn.icon svg { width: 24px; height: 24px; }

  /* ===== Liquid Glass（iOS 26 风格，折射仅 Chromium 生效） ===== */
  .glass-btn.liquid {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: url(#liquid-glass) blur(2px) saturate(160%);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    box-shadow:
      inset 1px 1px 1px rgba(255, 255, 255, 0.7),
      inset -1px -1px 1px rgba(255, 255, 255, 0.3),
      0 6px 20px rgba(0, 0, 0, 0.2);
  }
  .glass-btn.liquid::before { background: linear-gradient(135deg, rgba(255,255,255,.25), transparent 45%); }

  /* 分段控件 */
  .segmented {
    display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px;
    background: rgba(255,255,255,.14);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
  }
  .segmented button {
    border: none; background: transparent; color: #fff; font: 600 14px inherit; font-family: inherit;
    padding: 8px 18px; border-radius: 999px; cursor: pointer; transition: background .2s;
  }
  .segmented button[aria-pressed="true"] { background: rgba(255,255,255,.35); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .segmented button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .tip { font-size: 13px; opacity: .7; margin-top: 12px; }

  /* ===== 透镜版 Liquid Glass：feImage 位移贴图，只折射边缘 ===== */
  .glass-btn.lens {
    background: rgba(255, 255, 255, 0.06);
    /* 默认（Safari / Firefox）只做模糊；Chromium 由 JS 覆盖为 url(#lens-n) */
    -webkit-backdrop-filter: blur(10px) saturate(170%);
    backdrop-filter: blur(10px) saturate(170%);
    box-shadow:
      inset 1.5px 1.5px 1px rgba(255, 255, 255, 0.75),
      inset -1px -1px 1px rgba(255, 255, 255, 0.35),
      inset 0 0 12px rgba(255, 255, 255, 0.12),
      0 8px 24px rgba(0, 0, 0, 0.22);
  }
  .glass-btn.lens::before { background: linear-gradient(135deg, rgba(255,255,255,.18), transparent 40%); }

  /* 底部 Tab 栏（同样使用透镜滤镜） */
  .tabbar {
    display: inline-flex; gap: 6px; padding: 8px 10px; border-radius: 999px;
  }
  .tabbar.glass-btn { cursor: default; }
  .tabbar.glass-btn:hover { background: rgba(255, 255, 255, 0.06); }
  .tabbar.glass-btn:active { transform: none; }
  .tabbar button {
    width: 64px; height: 48px; border: none; border-radius: 999px; cursor: pointer;
    background: transparent; color: #fff; display: grid; place-items: center; transition: background .2s;
  }
  .tabbar button svg { width: 24px; height: 24px; }
  .tabbar button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.22); }
  .tabbar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* 参数面板 */
  .panel {
    display: grid; gap: 14px; padding: 18px 20px; border-radius: 20px; max-width: 420px;
    background: rgba(0, 0, 0, 0.28);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
  }
  .panel label { display: grid; grid-template-columns: 88px 1fr 44px; align-items: center; gap: 10px; font-size: 14px; }
  .panel output { text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
  .panel input[type="range"] { width: 100%; accent-color: #fff; }
  .map-preview { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .map-preview img { border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.3); max-width: 100%; }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass-btn, .segmented { background: rgba(60, 60, 67, 0.85); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass-btn, .segmented { background: rgba(60,60,67,.92); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .glass-btn { transition: none; }
  }
</style>
</head>
<body>
  <!-- Liquid Glass 位移滤镜 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid-glass" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="5" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="map" />
      <feDisplacementMap in="SourceGraphic" in2="map" scale="40" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- 透镜版滤镜容器：JS 按每个元素的尺寸生成 <filter id="lens-n"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs id="lens-defs"></defs>
  </svg>

  <div class="bg" id="bg">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="stripes"></div>
  </div>

  <main>
    <h1>iOS 玻璃按钮</h1>
    <p class="sub">backdrop-filter 毛玻璃 + SVG 位移折射（Liquid Glass）</p>

    <section>
      <h2>背景切换</h2>
      <div class="segmented" role="group" aria-label="背景切换">
        <button type="button" aria-pressed="true" data-bg="blobs">动态色块</button>
        <button type="button" aria-pressed="false" data-bg="photo">风景图片</button>
      </div>
    </section>

    <section>
      <h2>经典毛玻璃（iOS 15–18）</h2>
      <div class="row">
        <button class="glass-btn sm">小按钮</button>
        <button class="glass-btn">继续</button>
        <button class="glass-btn lg">开始使用</button>
      </div>
    </section>

    <section>
      <h2>变体：深色 / 着色 / 图标</h2>
      <div class="row">
        <button class="glass-btn dark">深色玻璃</button>
        <button class="glass-btn tint">蓝色着色</button>
        <button class="glass-btn icon" aria-label="播放">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="glass-btn icon dark" aria-label="收藏">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
        </button>
      </div>
    </section>

    <section>
      <h2>Liquid Glass（iOS 26）</h2>
      <div class="row">
        <button class="glass-btn liquid">Liquid 按钮</button>
        <button class="glass-btn liquid lg">折射效果</button>
        <button class="glass-btn liquid icon" aria-label="添加">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
        </button>
      </div>
      <p class="tip">边缘折射只在 Chrome / Edge 中生效，Safari、Firefox 会退回到普通模糊。</p>
    </section>

    <section>
      <h2>Liquid Glass 透镜版（feImage 位移贴图，只折射边缘）</h2>
      <div class="row">
        <button class="glass-btn lens">透镜按钮</button>
        <button class="glass-btn lens lg">边缘折射</button>
        <button class="glass-btn lens icon" aria-label="添加">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
        </button>
      </div>
      <div class="row" style="margin-top:20px">
        <div class="glass-btn lens tabbar" role="group" aria-label="底部导航">
          <button type="button" aria-pressed="true" aria-label="首页">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          </button>
          <button type="button" aria-pressed="false" aria-label="搜索">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
          </button>
          <button type="button" aria-pressed="false" aria-label="我的">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4m0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4"/></svg>
          </button>
        </div>
      </div>
      <p class="tip" id="lens-status"></p>
    </section>

    <section>
      <h2>透镜参数</h2>
      <div class="panel">
        <label>折射强度 <input type="range" id="p-scale" min="0" max="150" value="70" /> <output for="p-scale" id="o-scale">70</output></label>
        <label>边缘宽度 <input type="range" id="p-bezel" min="4" max="40" value="16" /> <output for="p-bezel" id="o-bezel">16</output></label>
        <label>模糊 <input type="range" id="p-blur" min="0" max="10" step="0.5" value="1" /> <output for="p-blur" id="o-blur">1</output></label>
      </div>
      <h2 style="margin-top:24px">位移贴图预览（R = X 偏移，G = Y 偏移，中性灰 = 不偏移）</h2>
      <div class="map-preview" id="map-preview"></div>
    </section>
  </main>

<script>
  const bg = document.getElementById('bg');
  document.querySelectorAll('.segmented button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.segmented button').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      bg.classList.toggle('photo', btn.dataset.bg === 'photo');
    });
  });

  // Tab 栏选中态
  document.querySelectorAll('.tabbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
    });
  });

  /* ===== 透镜版：按元素尺寸生成位移贴图 + SVG 滤镜 ===== */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const lensDefs = document.getElementById('lens-defs');
  const lensEls = [...document.querySelectorAll('.glass-btn.lens')];
  const params = { scale: 70, bezel: 16, blur: 1 };

  // backdrop-filter: url() 目前只有 Chromium 支持
  const supportsSvgBackdrop = !!navigator.userAgentData?.brands?.some(b => b.brand === 'Chromium');
  const reduceTransparency = matchMedia('(prefers-reduced-transparency: reduce)').matches;

  /**
   * 生成圆角矩形的位移贴图：
   * 边缘 bezel 宽度内，像素沿"向内法线"偏移，越靠边偏移越大；中心区域为中性灰（不偏移）。
   * feDisplacementMap 公式：P'(x,y) = P(x + scale*(R-0.5), y + scale*(G-0.5))
   */
  function buildMap(w, h, r, bezel) {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(w, h);
    const d = img.data;
    const hw = w / 2, hh = h / 2;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const px = x + 0.5 - hw, py = y + 0.5 - hh;
        // 圆角矩形 SDF
        const qx = Math.abs(px) - (hw - r), qy = Math.abs(py) - (hh - r);
        let dist, nx, ny;
        if (qx > 0 && qy > 0) {
          const len = Math.hypot(qx, qy);
          dist = len - r; nx = qx / len; ny = qy / len;
        } else if (qx > qy) {
          dist = qx - r; nx = 1; ny = 0;
        } else {
          dist = qy - r; nx = 0; ny = 1;
        }
        nx *= Math.sign(px) || 1;
        ny *= Math.sign(py) || 1;

        const inset = -dist; // 到边缘的距离，内部为正
        let m = 0;
        if (inset < 0) m = 1;
        else if (inset < bezel) {
          // 凸透镜曲面：越接近边缘斜率越大，使用圆弧剖面
          const t = 1 - inset / bezel;
          m = 1 - Math.sqrt(1 - t * t);
        }

        // 向内法线方向采样 → 背景向外"拉伸"，形成边缘弯折
        const i = (y * w + x) * 4;
        d[i]     = 128 - nx * m * 127;
        d[i + 1] = 128 - ny * m * 127;
        d[i + 2] = 128;
        d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return canvas;
  }

  function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function computeMap(el) {
    // 用 offsetWidth 而非 getBoundingClientRect，避免 :active 缩放影响尺寸
    const w = el.offsetWidth, h = el.offsetHeight;
    if (!w || !h) return null;
    const r = Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0, w / 2, h / 2);
    return buildMap(w, h, r, Math.min(params.bezel, Math.min(w, h) / 2));
  }

  function applyLens(el, idx) {
    const map = computeMap(el);
    if (!map) return;
    const w = map.width, h = map.height;
    const id = `lens-${idx}`;

    let filter = document.getElementById(id);
    if (!filter) {
      filter = svgEl('filter', {
        id,
        filterUnits: 'userSpaceOnUse',
        primitiveUnits: 'userSpaceOnUse',
        // 必须用 sRGB，否则贴图的 128 中性灰会被当作线性色值，导致整体偏移
        'color-interpolation-filters': 'sRGB',
      });
      filter.append(
        svgEl('feImage', { result: 'map', preserveAspectRatio: 'none' }),
        svgEl('feDisplacementMap', { in: 'SourceGraphic', in2: 'map', xChannelSelector: 'R', yChannelSelector: 'G' })
      );
      lensDefs.append(filter);
    }
    for (const node of [filter, filter.querySelector('feImage')]) {
      node.setAttribute('x', 0);
      node.setAttribute('y', 0);
      node.setAttribute('width', w);
      node.setAttribute('height', h);
    }
    filter.querySelector('feImage').setAttribute('href', map.toDataURL());
    filter.querySelector('feDisplacementMap').setAttribute('scale', params.scale);

    el.style.backdropFilter = `url(#${id}) blur(${params.blur}px) saturate(170%)`;
    el._lensMap = map;
  }

  function renderPreview() {
    const box = document.getElementById('map-preview');
    box.replaceChildren(...lensEls.map(el => {
      const img = new Image();
      if (el._lensMap) img.src = el._lensMap.toDataURL();
      img.alt = '位移贴图';
      return img;
    }));
  }

  function refreshAll() {
    lensEls.forEach(applyLens);
    renderPreview();
  }

  const status = document.getElementById('lens-status');
  if (supportsSvgBackdrop && !reduceTransparency) {
    status.textContent = '当前浏览器支持 backdrop-filter: url()，已启用边缘折射。';
    refreshAll();
    // 尺寸变化（字体加载、窗口缩放）时重新生成贴图
    new ResizeObserver(refreshAll).observe(document.body);
  } else {
    status.textContent = '当前浏览器不支持 backdrop-filter: url()（或开启了降低透明度），已退回普通模糊。贴图预览仍可查看。';
    lensEls.forEach(el => { el._lensMap = computeMap(el); });
    renderPreview();
  }

  // 参数面板
  [['scale', 'p-scale', 'o-scale'], ['bezel', 'p-bezel', 'o-bezel'], ['blur', 'p-blur', 'o-blur']].forEach(([key, inputId, outId]) => {
    const input = document.getElementById(inputId);
    input.addEventListener('input', () => {
      params[key] = Number(input.value);
      document.getElementById(outId).textContent = input.value;
      if (supportsSvgBackdrop && !reduceTransparency) refreshAll();
      else if (key === 'bezel') {
        lensEls.forEach(el => { el._lensMap = computeMap(el); });
        renderPreview();
      }
    });
  });
</script>
</body>
</html>

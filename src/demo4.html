</script>

<style>
    #main {
        width: 200px;
        height: 200px;
    }
</style>
<div>
    <div id="main"></div>
  <button id="btnDestroy">Destroy</button>
</div>
<script>
  const root = ReactDOM.createRoot(document.getElementById('main'))
  window.reactDemo.get('./src/Widget1').then(factory => {
    const Widget1 = factory().default

    root.render(React.createElement(Widget1, {name: 'name1', onClick: () => {console.log('333')}}))

    setTimeout(() => {
      root.render(React.createElement(Widget1, {name: 'name2', onClick: () => {console.log('333')}}))
    }, 3000)
  })

  document.getElementById('btnDestroy').addEventListener('click', () => {
    root.unmount()
  })
</script>
